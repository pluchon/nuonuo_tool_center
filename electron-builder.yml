appId: com.pluchon.nuonuo-tool-center
electronDist: node_modules/electron/dist
directories:
  output: dist
files:
  - out/**/*
  - drizzle/**/*
  - resources/icon.*
  - LICENSE
  - '!**/*.map'
  - '!node_modules/onnxruntime-node/bin/**/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/**/win32/arm64/**'
# 数据库和本地分级工作进程按文件路径加载 WASM、扩展和原生库。
asar: false
npmRebuild: false
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: NuonuoGallery-${version}-win-x64-Setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
